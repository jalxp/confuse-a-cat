const c=document.getElementById('c'),x=c.getContext('2d'),cat=new Image();cat.src=CAT;
function tinted(img,color){const t=document.createElement('canvas');t.width=img.width;t.height=img.height;const g=t.getContext('2d');g.drawImage(img,0,0);g.globalCompositeOperation='source-in';g.fillStyle=color;g.fillRect(0,0,t.width,t.height);return t}
function spaced(text,px,y,spacing,align){x.textBaseline='alphabetic';const chars=[...text];const widths=chars.map(ch=>x.measureText(ch).width);const total=widths.reduce((a,b)=>a+b,0)+spacing*(chars.length-1);let cx=align==='center'?px-total/2:px;chars.forEach((ch,i)=>{x.fillText(ch,cx,y);cx+=widths[i]+spacing});return total}
function draw(){
 const S=2,W=+document.getElementById('w').value,H=+document.getElementById('h').value;
 c.width=W*S;c.height=H*S;x.setTransform(S,0,0,S,0,0);x.clearRect(0,0,W,H);
 if(document.getElementById('bg').checked){x.fillStyle='#0A0A0A';x.fillRect(0,0,W,H)}
 const ghost=document.getElementById('ghost').checked;
 // cat on the left
 const ch=H*0.74,cw=cat.width*ch/cat.height,catX=W*0.13,catY=(H-ch)/2+H*0.02;
 if(ghost){x.globalAlpha=.6;x.drawImage(tinted(cat,'#D2452F'),catX-2,catY,cw,ch);x.drawImage(tinted(cat,'#5FB3C7'),catX+2,catY+1,cw,ch);x.globalAlpha=1}
 x.drawImage(cat,catX,catY,cw,ch);
 // text block to the right
 const tx=catX+cw+W*0.07,maxW=W-tx-W*0.06;
 let fs=H*0.30;x.font=`700 ${fs}px "Barlow Condensed"`;
 const measure=t=>{const s=fs*.06;return [...t].reduce((a,ch)=>a+x.measureText(ch).width,0)+s*(t.length-1)};
 while(measure('CONFUSE A CAT')>maxW&&fs>10){fs-=1;x.font=`700 ${fs}px "Barlow Condensed"`}
 const titleY=H*0.5+fs*0.28;
 if(ghost){x.globalAlpha=.6;x.fillStyle='#D2452F';spaced('CONFUSE A CAT',tx-2,titleY,fs*.06);x.fillStyle='#5FB3C7';spaced('CONFUSE A CAT',tx+2,titleY+1,fs*.06);x.globalAlpha=1}
 x.fillStyle='#ECE4D2';const tw=spaced('CONFUSE A CAT',tx,titleY,fs*.06);
 const gs=fs*0.30;x.font=`600 ${gs}px "Barlow Condensed"`;x.fillStyle='#8E8984';
 spaced('GAMES',tx+2,titleY+gs*1.45,gs*.5);
 c.toBlob(b=>{const a=document.getElementById('dl');if(a.dataset.u)URL.revokeObjectURL(a.dataset.u);a.dataset.u=URL.createObjectURL(b);a.href=a.dataset.u});
}
document.getElementById('go').onclick=draw;['w','h','bg','ghost'].forEach(id=>document.getElementById(id).onchange=draw);
Promise.all([document.fonts.load('700 40px "Barlow Condensed"'),document.fonts.load('600 40px "Barlow Condensed"'),new Promise(r=>cat.complete?r():cat.onload=r)]).then(draw);
</script>
